[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdilej-serialy"
version = "0.1.0"
description = "Read-only CR catalog to Sdilej.cz to Přehraj.to series episode pipeline"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.32",
  "requests-toolbelt>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
database = ["psycopg2-binary>=2.9"]
visual = ["lingua-language-detector==2.2.0"]
# PyAV 19 removed av.open(metadata_errors), used by faster-whisper 1.2.1.
whisper = ["faster-whisper==1.2.1", "av>=18.1,<19"]

[project.scripts]
sdilej-series = "sdilej_serialy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
